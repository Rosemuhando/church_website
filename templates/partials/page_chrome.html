<div class="page-chrome">
    <div class="page-chrome-inner">
        <div class="page-chrome-title" aria-live="polite">
            <i class="fa-solid fa-window-maximize" aria-hidden="true"></i>
            <span data-current-page-title></span>
        </div>
        <div class="page-chrome-controls" role="group" aria-label="Page navigation">
            <button type="button" data-page-back aria-label="Go back" title="Go back">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>
            <button type="button" data-page-forward aria-label="Go forward" title="Go forward">
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <button type="button" data-page-refresh aria-label="Refresh page" title="Refresh page">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
