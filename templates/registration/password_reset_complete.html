{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated | Full Gospel Churches of Kenya - Njiru</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="{% static 'js/site-search.js' %}?v=6" defer></script>
</head>
<body class="auth-page">
    <header class="navbar auth-navbar">
        <a class="logo" href="{% url 'home' %}"><i class="fa-solid fa-cross" aria-hidden="true"></i> Full Gospel Churches of Kenya - Njiru</a>
        {% include 'partials/page_chrome.html' %}
        <a class="auth-home-link" href="{% url 'home' %}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to site</a>
    </header>
    <main class="auth-main">
        <section class="auth-panel" aria-labelledby="complete-heading">
            <div class="auth-mark"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></div>
            <p class="auth-eyebrow">ACCOUNT RECOVERY</p>
            <h1 id="complete-heading">Password updated</h1>
            <p class="auth-intro">Your password has been changed. You can sign in with your new password.</p>
            <a class="auth-submit auth-action-link" href="{% url 'login' %}">Sign in</a>
        </section>
    </main>
</body>
</html>
